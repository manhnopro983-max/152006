server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Only collect logs from expense-* containers
      - source_labels: ['__meta_docker_container_name']
        regex: '/expense-(.*)'
        action: keep

      # Extract service name: expense-app → app, expense-nginx → nginx
      - source_labels: ['__meta_docker_container_name']
        regex: '/expense-(.*)'
        target_label: 'service'

      # Full container name
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
