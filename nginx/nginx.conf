worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    charset       utf-8;
    charset_types text/css application/javascript application/json;

    # Structured log format for Promtail parsing
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # Hide nginx version (hardening)
    server_tokens off;

    # Security headers
    add_header X-Content-Type-Options  "nosniff"                        always;
    add_header X-Frame-Options         "SAMEORIGIN"                     always;
    add_header X-XSS-Protection        "1; mode=block"                  always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'" always;

    upstream app_backend {
        server app:3000;
    }

    upstream pgadmin_backend {
        server pgadmin:80;
    }

    upstream grafana_backend {
        server grafana:3000;
    }

    # Vietnamese UI overlays are served only through the loopback-bound
    # localhost port 8080. Existing direct service ports remain available.
    server {
        listen 8080;
        server_name pgadmin.localhost;

        location = /vietnamese-ui.js {
            alias /usr/share/nginx/html/vietnamese-ui.js;
            add_header Cache-Control "no-cache";
        }

        location / {
            proxy_pass http://pgadmin_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Accept-Encoding "";
            sub_filter_once on;
            sub_filter '</body>' '<script defer src="/vietnamese-ui.js?v=2"></script></body>';
        }
    }

    server {
        listen 8080;
        server_name grafana.localhost;

        location = /vietnamese-ui.js {
            alias /usr/share/nginx/html/vietnamese-ui.js;
            add_header Cache-Control "no-cache";
        }

        location / {
            proxy_pass http://grafana_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Accept-Encoding "";
            sub_filter_once on;
            sub_filter '</body>' '<script defer src="/vietnamese-ui.js?v=2"></script></body>';
        }
    }

    server {
        listen 80;
        server_name _;

        # Limit request body size
        client_max_body_size 2m;

        # Block metrics endpoint from public access (scraped internally by Prometheus)
        location /metrics {
            deny all;
            return 403;
        }

        location / {
            proxy_pass         http://app_backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
    }
}
