version: '3.8'

services:
  # -------- Application --------
  app:
    build: ./app
    container_name: expense-app
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-expense_tracker}
      - DB_USER=${POSTGRES_USER:-expense_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-change_me}
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - frontend
      - backend
      - monitoring
    restart: unless-stopped

  # -------- PostgreSQL --------
  postgres:
    image: postgres:16-alpine
    container_name: expense-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-expense_tracker}
      - POSTGRES_USER=${POSTGRES_USER:-expense_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/sample-data.sql:/docker-entrypoint-initdb.d/02-sample-data.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-expense_user} -d $${POSTGRES_DB:-expense_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend
    restart: unless-stopped

  # -------- pgAdmin --------
  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: expense-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@expense.local}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-change_me}
      - PGADMIN_LISTEN_PORT=80
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - backend
    restart: unless-stopped

  # -------- Nginx Reverse Proxy --------
  nginx:
    image: nginx:1.27-alpine
    container_name: expense-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - frontend
    restart: unless-stopped

  # ======== MONITORING (Phase 2) ========

  # -------- Prometheus --------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: expense-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - monitoring
    restart: unless-stopped

  # -------- Grafana --------
  grafana:
    image: grafana/grafana:11.3.0
    container_name: expense-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - monitoring
    restart: unless-stopped

  # -------- PostgreSQL Exporter --------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: expense-postgres-exporter
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER:-expense_user}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-expense_tracker}?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - monitoring
    restart: unless-stopped

  # -------- cAdvisor --------
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: expense-cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  monitoring:
    driver: bridge
