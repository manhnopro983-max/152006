services:
  # -------- Application --------
  app:
    build: ./app
    container_name: expense-app
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:?Set POSTGRES_DB in .env}
      - DB_USER=${APP_DB_USER:?Set APP_DB_USER in .env}
      - DB_PASSWORD=${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - frontend
      - backend
      - monitoring
    restart: unless-stopped

  # -------- PostgreSQL --------
  postgres:
    image: postgres:16-alpine
    container_name: expense-postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/sample-data.sql:/docker-entrypoint-initdb.d/02-sample-data.sql:ro
      - ./database/03-app-user.sh:/docker-entrypoint-initdb.d/03-app-user.sh:ro
    environment:
      - POSTGRES_DB=${POSTGRES_DB:?Set POSTGRES_DB in .env}
      - POSTGRES_USER=${POSTGRES_USER:?Set POSTGRES_USER in .env}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      - APP_DB_USER=${APP_DB_USER:?Set APP_DB_USER in .env}
      - APP_DB_PASSWORD=${APP_DB_PASSWORD:?Set APP_DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-expense_user} -d $${POSTGRES_DB:-expense_tracker}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - backend
    restart: unless-stopped

  # -------- pgAdmin --------
  pgadmin:
    image: dpage/pgadmin4:8.14
    container_name: expense-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:?Set PGADMIN_EMAIL in .env}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env}
      - PGADMIN_LISTEN_PORT=80
      - PGADMIN_SERVER_JSON_FILE=/pgadmin4/servers.json
    ports:
      - "127.0.0.1:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./database/pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      - postgres
    networks:
      - backend
    restart: unless-stopped

  # -------- Nginx Reverse Proxy --------
  nginx:
    image: nginx:1.27-alpine
    container_name: expense-nginx
    ports:
      - "80:80"
      - "127.0.0.1:8080:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/vietnamese-ui.js:/usr/share/nginx/html/vietnamese-ui.js:ro
    depends_on:
      - app
      - pgadmin
      - grafana
    networks:
      - frontend
      - backend
      - monitoring
    restart: unless-stopped

  # ======== MONITORING (Phase 2) ========

  # -------- Prometheus --------
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: expense-prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    networks:
      - monitoring
    restart: unless-stopped

  # -------- Grafana --------
  grafana:
    image: grafana/grafana:11.3.0
    container_name: expense-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:?Set GRAFANA_USER in .env}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?Set GRAFANA_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_DOMAIN=grafana.localhost
      - GF_SERVER_ROOT_URL=http://grafana.localhost:8080/
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
      - loki
    networks:
      - monitoring
    restart: unless-stopped

  # -------- PostgreSQL Exporter --------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: expense-postgres-exporter
    environment:
      - DATA_SOURCE_URI=postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB in .env}?sslmode=disable
      - DATA_SOURCE_USER=${POSTGRES_USER:?Set POSTGRES_USER in .env}
      - DATA_SOURCE_PASS=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - monitoring
    restart: unless-stopped

  # -------- cAdvisor --------
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: expense-cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - monitoring
    restart: unless-stopped

  # ======== LOGGING (Phase 3) ========

  # -------- Loki --------
  loki:
    image: grafana/loki:3.2.1
    container_name: expense-loki
    volumes:
      - ./logging/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - monitoring
    restart: unless-stopped

  # -------- Promtail --------
  promtail:
    image: grafana/promtail:3.2.1
    container_name: expense-promtail
    volumes:
      - ./logging/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - monitoring
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
  monitoring:
    driver: bridge
